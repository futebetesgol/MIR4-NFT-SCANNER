name: MIR4 NFT Scanner

on:
  # Permite executar manualmente pelo botão "Run workflow"
  workflow_dispatch:

  # Executa automaticamente a cada 1 hora
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Executar MIR4 NFT Scanner
        run: |
          python scanner_job.py

      - name: Salvar resultados
        run: |
          git config user.name "MIR4-NFT-BOT"
          git config user.email "actions@github.com"

          git add docs/results.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
          else
            git commit -m "Atualiza resultados MIR4 NFT Scanner"
            git push
          fi
