services:
  - type: web
    name: mir4-nft-scanner
    runtime: python
    plan: free

    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
