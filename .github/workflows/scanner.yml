name: MIR4 NFT Scanner

on:
  # Permite executar manualmente
  workflow_dispatch:

  # Executa automaticamente a cada 1 hora
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Executar MIR4 NFT Scanner
        run: python scanner_job.py

      - name: Mostrar arquivos encontrados
        if: always()
        run: |
          echo "===== ARQUIVOS DO PROJETO ====="
          find . -maxdepth 3 -type f | sort
          echo "==============================="

      - name: Salvar resultados no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/results.json 2>/dev/null || true
          git add xdraco_requests.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao nova para salvar."
          else
            git commit -m "Atualiza resultados MIR4 NFT Scanner"
            git push
          fi
