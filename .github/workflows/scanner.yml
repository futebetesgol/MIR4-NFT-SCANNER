name: MIR4 NFT Scanner

on:
  # Executar manualmente pelo GitHub
  workflow_dispatch:

  # Executar automaticamente a cada 1 hora
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # BAIXAR PROJETO
      # ====================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ====================================================
      # CONFIGURAR PYTHON
      # ====================================================

      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ====================================================
      # INSTALAR DEPENDÊNCIAS
      # ====================================================

      - name: Instalar dependencias

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          python -m playwright install chromium


      # ====================================================
      # EXECUTAR NOSSO ROBÔ
      # ====================================================

      - name: Executar MIR4 NFT Scanner

        run: |

          python scanner_job.py


      # ====================================================
      # MOSTRAR ARQUIVOS CRIADOS
      # ====================================================

      - name: Mostrar arquivos encontrados

        if: always()

        run: |

          echo "========================================"

          echo "ARQUIVOS CRIADOS PELO MIR4 NFT SCANNER"

          echo "========================================"

          find . -maxdepth 3 -type f | sort

          echo "========================================"


      # ====================================================
      # SALVAR RESULTADOS NO GITHUB
      # ====================================================

      - name: Salvar resultados no repositorio

        if: always()

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          echo "Preparando arquivos..."


          # RESULTADOS DO SITE
          git add docs/results.json 2>/dev/null || true


          # REQUISIÇÕES ENCONTRADAS NO XDRACO
          git add xdraco_requests.json 2>/dev/null || true


          # DADOS REAIS DO PERSONAGEM
          git add character_summary.json 2>/dev/null || true


          echo "Verificando alterações..."


          if git diff --cached --quiet; then

            echo "Nenhuma alteração nova para salvar."

          else

            echo "Salvando novos dados..."

            git commit -m "Atualiza dados MIR4 NFT Scanner"

            git push

            echo "Dados salvos com sucesso."

          fi
